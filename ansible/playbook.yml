- hosts: all
  become: yes

  module_defaults:
    ansible.builtin.apt:
      update_cache: true
      cache_valid_time: 3600

  vars:
    min_ansible_version: 2.7
    supported_architectures:
    - x86_64
    - aarch64
    supported_distributions:
    - CentOS
    - Rocky
    - RedHat
    - Debian
    - Ubuntu
    paths:
      install: /usr/local
      src: /usr/local/src
      etc: /usr/local/etc
      build: /tmp
      apps: /opt/apps
      modulefiles: /opt/apps/modulefiles
    install_cuda: true
    install_ompi: true
    install_lustre: true
    install_managed_lustre: false
    install_munge: true
    slurm_patch_files: []
    install_gcsfuse: true
    install_gcsfuse_spank: false
    install_pmix: true
    install_pyxis: true
    allow_kernel_upgrades: true

  pre_tasks:
  - name: Minimum Ansible Version Check
    assert:
      that: ansible_version.full is version_compare({{min_ansible_version}}, '>=')
      msg: Update Ansible to at least {{min_ansible_version}} to use this playbook.
  - name: Check Supported Distribution
    ansible.builtin.assert:
      that: ansible_distribution in supported_distributions
      fail_msg: |
        OS {{ ansible_distribution }} is not supported. Use one of these distributions:
          {{ supported_distributions }}
  - name: Check Supported Architectures
    ansible.builtin.assert:
      that: ansible_architecture in supported_architectures
      fail_msg: |
        Architecture {{ ansible_architecture }} is not supported. Use one of these architectures:
          {{ supported_architectures }}
  - name: Classify hosts by architecture
    group_by:
      key: arch_{{ ansible_architecture }}
  - name: Classify hosts by Linux distribution
    group_by:
      key: os_{{ ansible_distribution | lower }}
  - name: Check Support on CentOS
    when: ansible_distribution == "CentOS"
    ansible.builtin.assert:
      that: ansible_distribution_major_version is version('7', '==')
      fail_msg: |
        When building Slurm-GCP on CentOS, use release 7
  - name: Check Support on Rocky Linux
    when: ansible_distribution == "Rocky"
    ansible.builtin.assert:
      that: ansible_distribution_major_version is version('8', '==') or ansible_distribution_major_version is version('9', '==')
      fail_msg: |
        When building Slurm-GCP on Rocky Linux, use release 8 or 9
  - name: Check Support on RedHat Linux
    when: ansible_distribution == "RedHat"
    ansible.builtin.assert:
      that: ansible_distribution_major_version is version('8', '==') or ansible_distribution_major_version is version('9', '==')
      fail_msg: |
        When building Slurm-GCP on RedHat Linux, use release 8 or 9
  - name: Check Support on Debian
    when: ansible_distribution == "Debian"
    ansible.builtin.assert:
      that:
      - ansible_distribution_major_version is version('10', '>=')
      - ansible_distribution_major_version is version('12', '<=')
      fail_msg: |
        When building Slurm-GCP on Debian, use release 10 or above
  - name: Check Support on Ubuntu
    when: ansible_distribution == "Ubuntu"
    ansible.builtin.assert:
      that: ansible_distribution_version is version('20.04', '==') or ansible_distribution_version is version('22.04', '==') or ansible_distribution_version is version('24.04', '==')
      fail_msg: |
        When building Slurm-GCP on Ubuntu, use release 20.04/22.04/24.04
  - name: Check Lustre Install Options
    ansible.builtin.assert:
      that: not (install_lustre and install_managed_lustre)
      fail_msg: |
        install_lustre and install_managed_lustre are mutually exclusive Options
  - name: Check Managed Lustre Install Options
    when: install_managed_lustre
    ansible.builtin.assert:
      that: (ansible_distribution == "Ubuntu" and (ansible_distribution_version is version('20.04', '==') or ansible_distribution_version is version('22.04', '==') or ansible_distribution_version is version('24.04', '=='))) or (ansible_distribution == "Rocky" and (ansible_distribution_major_version is version('8', '==') or ansible_distribution_major_version is version('9', '==')))
      fail_msg: |
        Managed Lustre is only compatible with Rocky 8, Rocky 9, Ubuntu 20.04, Ubuntu 22.04, and Ubuntu 24.04
  - name: Freeze kernel before running playbook
    ansible.builtin.command:
      argv:
      - apt-mark
      - hold
      - "{{ item }}"
    loop: "{{ kernel_packages }}"
    when: ansible_os_family == "Debian"

  - name: Install dnf versionlock plugin before running playbook (RedHat/Rocky)
    ansible.builtin.package:
      name: python3-dnf-plugin-versionlock
      state: present
    when: ansible_os_family == "RedHat" and ansible_distribution_major_version in ['8', '9']

  - name: Freeze kernel before running playbook (RedHat/Rocky)
    ansible.builtin.command:
      argv:
      - dnf
      - versionlock
      - add
      - "{{ item }}"
    loop: "{{ kernel_packages }}"
    register: versionlock_add
    changed_when: "'Adding versionlock on:' in versionlock_add.stdout"
    when: ansible_os_family == "RedHat" and ansible_distribution_major_version in ['8', '9']

  - name: Get installed CIQ rdma-core version (RedHat/Rocky)
    ansible.builtin.command: rpm -q --qf '%{VERSION}-%{RELEASE}' rdma-core
    register: rdma_core_ver
    failed_when: false
    changed_when: false
    when: ansible_os_family == "RedHat" and ansible_distribution_major_version in ['8', '9']

  - name: Align and pre-install exact CIQ RDMA/verbs stack to match base driver (RedHat/Rocky)
    ansible.builtin.dnf:
      name:
      - "rdma-core-{{ rdma_core_ver.stdout | default('') | trim }}"
      - "rdma-core-devel-{{ rdma_core_ver.stdout | default('') | trim }}"
      - "libibverbs-{{ rdma_core_ver.stdout | default('') | trim }}"
      - "libibverbs-utils-{{ rdma_core_ver.stdout | default('') | trim }}"
      - "librdmacm-{{ rdma_core_ver.stdout | default('') | trim }}"
      - "librdmacm-utils-{{ rdma_core_ver.stdout | default('') | trim }}"
      - "libibumad-{{ rdma_core_ver.stdout | default('') | trim }}"
      - "infiniband-diags-{{ rdma_core_ver.stdout | default('') | trim }}"
      state: present
      allow_erasing: true
      disable_excludes: ciq-sigcloud-next
      disable_plugin: protected-kmods
    when:
    - ansible_os_family == "RedHat" and ansible_distribution_major_version in ['8', '9']
    - rdma_core_ver.rc | default(-1) == 0 and 'ciq' in rdma_core_ver.stdout | default('')

  - name: Install build dependencies for perftest (RedHat/Rocky)
    ansible.builtin.dnf:
      name:
      - git
      - autoconf
      - automake
      - libtool
      - make
      - gcc
      - pciutils-devel
      state: present
      disable_excludes: all
    when:
    - ansible_os_family == "RedHat" and ansible_distribution_major_version in ['8', '9']
    - rdma_core_ver.rc | default(-1) == 0 and 'ciq' in rdma_core_ver.stdout | default('')

  - name: Build and install perftest (ib_send_bw) from source against locked CIQ verbs headers (RedHat/Rocky)
    ansible.builtin.shell: |
      set -e
      rm -rf /tmp/perftest_build
      git clone --depth=1 --branch v24.07.0-0.43 https://github.com/linux-rdma/perftest.git /tmp/perftest_build
      cd /tmp/perftest_build && ./autogen.sh && ./configure --prefix=/usr/local && make -j {{ ansible_processor_vcpus }} && make install
      rm -rf /tmp/perftest_build
    args:
      creates: /usr/local/bin/ib_send_bw
    when:
    - ansible_os_family == "RedHat" and ansible_distribution_major_version in ['8', '9']
    - rdma_core_ver.rc | default(-1) == 0 and 'ciq' in rdma_core_ver.stdout | default('')

  - name: Freeze RDMA/interconnect stack before running playbook (RedHat/Rocky)
    ansible.builtin.command:
      argv:
      - dnf
      - versionlock
      - add
      - "{{ item }}"
    loop: "{{ rdma_packages | default([]) }}"
    register: versionlock_rdma_add
    changed_when: "'Adding versionlock on:' in versionlock_rdma_add.stdout"
    when: ansible_os_family == "RedHat" and ansible_distribution_major_version in ['8', '9']

  - name: Get existing excludepkgs from dnf.conf (RedHat/Rocky)
    ansible.builtin.shell: grep -Ei '^[[:space:]]*excludepkgs[[:space:]]*=' /etc/dnf/dnf.conf | head -n 1 | sed 's/^[^=]*=[[:space:]]*//'
    register: existing_excludepkgs
    changed_when: false
    failed_when: false
    when: ansible_os_family == "RedHat" and ansible_distribution_major_version in ['8', '9']

  - name: Exclude stock perftest and libfabric RPMs while preserving existing exclusions (RedHat/Rocky)
    ansible.builtin.ini_file:
      path: /etc/dnf/dnf.conf
      section: main
      option: excludepkgs
      value: "{{ (existing_excludepkgs.stdout | default('') | trim ~ ' perftest* libfabric*') | trim }}"
      mode: '0644'
    when:
    - ansible_os_family == "RedHat" and ansible_distribution_major_version in ['8', '9']
    - "'perftest*' not in (existing_excludepkgs.stdout | default(''))"

  roles:
  - motd
  - common
  - kernel
  - selinux
  - role: cuda
    vars:
      gpu: true
      cuda_bash_profile: true
      cuda_restart_node_on_install: false
      cuda_init_restart_service: false
      cuda_runfile_disable_nvidia_drm: true
    when:
    - install_cuda
    - ansible_architecture == "x86_64"
  - role: pmix
    when:
    - install_pmix
  - nfs
  - cgroups
  - role: munge
    when:
    - install_munge
  - mariadb
  - libjwt
  - lmod
  - slurm
  - slurmcmd
  - role: pyxis
    when:
    - install_pyxis
  - role: ompi
    when: install_ompi
  - role: lustre
    when:
    - install_lustre
    - ansible_architecture == "x86_64"
  - role: managed_lustre
    when:
    - install_managed_lustre
  - role: gcsfuse
    when:
    - install_gcsfuse
  - role: gcsfuse_spank
    when:
    - install_gcsfuse_spank
  - role: cloudagents
  - logrotate
  - python
  - role: ldap
    when: ansible_os_family != 'Debian'
  - scripts

  post_tasks:
  - name: Re-enable kernel upgrades by apt-get upgrade
    ansible.builtin.command:
      argv:
      - apt-mark
      - unhold
      - "{{ item }}"
    loop: "{{ kernel_packages }}"
    when:
    - ansible_os_family == "Debian"
    - allow_kernel_upgrades

  - name: Re-enable kernel upgrades by dnf upgrade (RedHat/Rocky)
    ansible.builtin.command:
      argv:
      - dnf
      - versionlock
      - delete
      - "{{ item }}"
    loop: "{{ kernel_packages }}"
    register: versionlock_del
    failed_when: false
    changed_when: "'No package found' not in versionlock_del.stderr and 'No package found' not in versionlock_del.stdout"
    when:
    - ansible_os_family == "RedHat" and ansible_distribution_major_version in ['8', '9']
    - allow_kernel_upgrades
